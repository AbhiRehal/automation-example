apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation-example
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: automation-example
  template:
    metadata:
      labels:
        app: automation-example
    spec:
      containers:
        - name: automation-example
          image: 637423660148.dkr.ecr.ap-southeast-2.amazonaws.com/automation-example
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
      imagePullSecrets:
        - name: ecr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: automation-example-service
  namespace: dev
spec:
  type: LoadBalancer
  selector:
    app: automation-example
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
